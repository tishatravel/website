<section class="contact section section--alt" aria-labelledby="contact-heading">
  <div class="container">
    <h2 id="contact-heading" class="section-title">Request a Quotation</h2>
    <p class="section-subtitle">Tell us about your travel plans and we will get back to you within 1–2 business days</p>
    <div class="contact__grid">
      <div class="contact__info">
        <h3>Get in Touch</h3>
        <ul class="contact__channels">
          <li><strong>Phone:</strong> <a data-contact-phone href="#">Call us</a></li>
          <li><strong>Email:</strong> <a data-contact-email href="#">Email us</a></li>
          <li><strong>Facebook:</strong> <a data-contact-facebook href="#">Message us</a></li>
          <li data-contact-address-wrap><strong>Location:</strong> <span data-contact-address></span></li>
        </ul>
      </div>
      <div class="contact__form-wrap">
        <div data-form-alert hidden role="alert"></div>
        <form id="inquiry-form" class="inquiry-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required autocomplete="name" minlength="2" maxlength="100">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="packageId">Package Interest</label>
            <select id="packageId" name="packageId">
              <option value="">General Inquiry</option>
            </select>
          </div>
          <div class="form-group">
            <label for="travelDates">Preferred Travel Dates</label>
            <input type="text" id="travelDates" name="travelDates" maxlength="100" placeholder="e.g., June 2026">
          </div>
          <div class="form-group">
            <label for="message">Your Message *</label>
            <textarea id="message" name="message" rows="5" required minlength="10" maxlength="1000" placeholder="Tell us about your destination, group size, and preferences..."></textarea>
          </div>
          <div class="form-group form-group--checkbox">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I agree to be contacted by Tisha Travel and Tours regarding my inquiry.</label>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Submit Inquiry</button>
        </form>
      </div>
    </div>
  </div>
</section>
